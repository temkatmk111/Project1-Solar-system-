<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body
    style="--bg-image: url(&quot;./image/galaxy.webp&quot;)"
    class="centerimage"
  >
    <div class="planets">
      <div
        class="sun center-image center-position"
        style="--center-image-url: url(&quot;./image/sun.png&quot;)"
      ></div>
      <div
        class="orbit center-position"
        style="--orbit-size: 150px; --orbit-period: 8.8s"
      >
        <div
          class="planet center-position center-image"
          style="
            --planet-size: 15px;
            --center-image-url: url(&quot;./image/mercury.png&quot;);
            --rotation-period: 5.86s;
          "
        ></div>
      </div>
      <div
        class="orbit center-position"
        style="--orbit-size: 200px; --orbit-period: 22.5s"
      >
        <div
          class="planet center-position center-image"
          style="
            --planet-size: 20px;
            --center-image-url: url(&quot;./image/venus.png&quot;);
            --rotation-period: 24, 3s;
          "
        ></div>
      </div>
      <div
        class="orbit center-position"
        style="--orbit-size: 300px; --orbit-period: 36.5s"
      >
        <div
          class="planet center-position center-image"
          style="
            --planet-size: 23px;
            --center-image-url: url(&quot;./image/earth.png&quot;);
            --rotation-period: 1s;
          "
        ></div>
      </div>
      <div
        class="orbit center-position"
        style="--orbit-size: 400px; --orbit-period: 68.7s"
      >
        <div
          class="planet center-position center-image"
          style="
            --planet-size: 17px;
            --center-image-url: url(&quot;./image/mars.png&quot;);
            --rotation-period: 1.025s;
          "
        ></div>
      </div>

      <div
        class="orbit center-position"
        style="--orbit-size: 550px; --orbit-period: 118.6s"
      >
        <div
          class="planet center-position center-image"
          style="
            --planet-size: 45px;
            --center-image-url: url(&quot;./image/jupiter.png&quot;);
            --rotation-period: 0.41s;
          "
        ></div>
      </div>
      <div
        class="orbit center-position"
        style="--orbit-size: 650px; --orbit-period: 294.6s"
      >
        <div
          class="planet center-position center-image"
          style="
            --planet-size: 40px;
            --center-image-url: url(&quot;./image/saturn.png&quot;);
            --rotation-period: 0.455s;
          "
        ></div>
      </div>
        <div
            class="orbit center-position"
            style="--orbit-size: 750px; --orbit-period: 840.s"
        >
            <div
                class="planet center-position center-image"
                style="
                    --planet-size: 35px;
                    --center-image-url: url(&quot;./image/uranus.png&quot;);
                    --rotation-period: 0.717s;
                "
            ></div>
        </div>
    </div>
  </body>
</html>
